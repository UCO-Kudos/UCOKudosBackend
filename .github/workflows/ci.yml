name: CI-CD backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial completo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compila, corre pruebas unitarias + ArchUnit y genera cobertura (JaCoCo)
      - name: Build y pruebas
        run: mvn -B verify

      # Análisis estático. Requiere secret SONAR_TOKEN y los valores de tu proyecto.
      - name: SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORG }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      # Trivy sobre el código y dependencias (falla solo con CRITICAL)
      - name: Trivy (código y dependencias)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'          # informe de HIGH; abajo se bloquea solo CRITICAL
          format: table

      - name: Trivy (bloquea CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'

      - name: Construir imagen
        run: docker build -t uco-kudos-backend:${{ github.sha }} .

      - name: Trivy (imagen)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: uco-kudos-backend:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          format: table

  cd:
    # CD: solo si el CI quedó verde y es la rama main
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Esperar y probar el servicio
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/actuator/health" | grep -q '"status":"UP"'; then echo "UP"; exit 0; fi
            sleep 10
          done
          echo "El servicio no respondió UP"; exit 1
