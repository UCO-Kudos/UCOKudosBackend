# Toda la configuración sensible llega por variables de entorno (ver .env.example).
spring:
  application:
    name: uco-kudos-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    # Valores reales del destinatario de la semilla V2 (no se publican en el repositorio)
    placeholders:
      seed_dest_correo: ${SEED_DEST_CORREO:destinatario@example.com}
      seed_dest_celular: ${SEED_DEST_CELULAR:+570000000003}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

# Logs en JSON (formato ECS) a stdout; incluyen el MDC (traceId)
logging:
  structured:
    format:
      console: ecs
